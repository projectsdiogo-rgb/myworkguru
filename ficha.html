<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06323a">
<title>Ficha do tanque · MyWorkGuru</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="modulepreload" href="firebase.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500&display=swap" rel="stylesheet">
<style>
:root{--sea:#06323a;--sea2:#0a5560;--teal:#11a3ad;--foam:#e6f7f6;--sand:#f6efe2;--sun:#ffb347;--ink:#10232a;--muted:#5b6f77;--card:#fff;--bg:#f4f8f8;--line:#dbe7e8}
@media (prefers-color-scheme:dark){:root{--ink:#e7f1f2;--muted:#93a9ae;--card:#0f1e23;--bg:#081418;--line:#1d3138;--foam:#0f2a2e;--sand:#1c2420}}
*{box-sizing:border-box}html,body{margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}

/* ===== CAPA ===== */
.hero{position:relative;height:88svh;min-height:520px;max-height:900px;overflow:hidden;color:#fff;background:radial-gradient(120% 80% at 70% 10%,#18a7b0 0%,#0a5560 45%,#06323a 100%)}
.hero .ph{position:absolute;inset:-4%;background:center/cover no-repeat;animation:kb 26s ease-in-out infinite alternate;will-change:transform}
.hero .ph.lo{filter:blur(2px) saturate(1.05)}
@keyframes kb{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.16) translate(-2%,-1.5%)}}
.hero .tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,20,26,.55) 0%,rgba(3,20,26,0) 22%,rgba(3,20,26,0) 42%,rgba(4,38,45,.72) 76%,rgba(4,38,45,.96) 100%)}
.hero .rays{position:absolute;inset:-20% -10% auto;height:80%;background:repeating-conic-gradient(from 200deg at 60% -10%,rgba(255,255,255,.10) 0deg 4deg,transparent 4deg 14deg);mix-blend-mode:soft-light;animation:rays 9s ease-in-out infinite alternate;pointer-events:none;-webkit-mask-image:linear-gradient(180deg,#000,transparent);mask-image:linear-gradient(180deg,#000,transparent)}
@keyframes rays{from{opacity:.5;transform:rotate(-2deg)}to{opacity:1;transform:rotate(2deg)}}
.bub{position:absolute;bottom:-20px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.6),rgba(255,255,255,.05) 45%,transparent 60%);animation:rise linear infinite;pointer-events:none;z-index:2}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}100%{transform:translate(var(--dx),-95svh);opacity:0}}
.hero .top{position:absolute;top:calc(14px + env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;letter-spacing:.03em}
.pill img{width:18px;height:18px;border-radius:5px;background:#fff}
.hero .txt{position:absolute;left:0;right:0;bottom:84px;z-index:3}
.kicker{font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;opacity:.9;display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:28px;height:2px;background:var(--sun);border-radius:2px}
.hero h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(46px,13vw,76px);line-height:.95;margin:10px 0 6px;letter-spacing:-.02em;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.hero .sci{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:19px;opacity:.92}
.hero .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.hero .tags span{background:rgba(255,255,255,.92);color:var(--sea);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
.cue{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;color:var(--sea);text-decoration:none;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:0}
.cue svg{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(5px)}}
.hero .wave{position:absolute;left:0;bottom:-1px;z-index:2;color:var(--bg);height:60px;width:200%;animation:wave 14s linear infinite}
@keyframes wave{to{transform:translateX(-50%)}}
.hero .nophoto{position:absolute;right:-6px;top:15%;width:84%;max-width:440px;z-index:1;filter:drop-shadow(0 20px 40px rgba(0,0,0,.3));animation:swim 6s ease-in-out infinite}
.hero .nophoto svg{width:100%;height:auto}
@keyframes swim{50%{transform:translate(-12px,8px) rotate(-2deg)}}

/* ===== SECÇÕES ===== */
section{padding:30px 0 4px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin:0 0 6px}
h2{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:30px;line-height:1.05;margin:0 0 14px;letter-spacing:-.01em}
.lead{font-size:16.5px;line-height:1.65;margin:0}
.muted{color:var(--muted)}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}

.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:-34px;position:relative;z-index:4}
.num{background:var(--card);border-radius:22px;padding:14px 14px 13px;box-shadow:0 10px 30px rgba(6,50,58,.10);border:1px solid var(--line);overflow:hidden;position:relative}
.num .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:8px}
.num b{display:block;font-family:Fraunces,Georgia,serif;font-size:28px;font-weight:800;letter-spacing:-.01em;line-height:1.05}
.num b small{font-family:Inter,sans-serif;font-size:14px;font-weight:600;margin-left:2px}
.num .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.num .cmp{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.4;border-top:1px dashed var(--line);padding-top:8px}
.num .cmp b{display:inline;font-family:Inter,sans-serif;font-size:13px;font-weight:700;color:var(--ink)}
.num.wide{grid-column:1/-1;display:flex;gap:14px;align-items:center}
.num.wide .ic{margin:0;flex:none}
.num.wide .school-mini{margin-left:auto;color:var(--teal);opacity:.55;display:flex;gap:2px;align-items:center}
.c1 .ic{background:#e3f6f7;color:#0e8f99}.c2 .ic{background:#fff2df;color:#d9801a}.c3 .ic{background:#ffe9e3;color:#e0603f}.c4 .ic{background:#e9edff;color:#4f63d8}.c5 .ic{background:#eaf7e6;color:#3f9a2c}
@media (prefers-color-scheme:dark){.num .ic{background:rgba(255,255,255,.07)!important}}

.who{background:var(--card);border-radius:26px;padding:22px 20px;border:1px solid var(--line)}
.who .illu{width:100%;max-width:400px;margin:-2px auto 10px;animation:swim 7s ease-in-out infinite}
.who .illu svg{width:100%;height:auto;display:block}
.facts{display:grid;gap:10px;margin-top:18px}
.fact{display:flex;gap:12px;align-items:flex-start;background:var(--foam);border-radius:18px;padding:13px 14px}
.fact .fi{flex:none;width:34px;height:34px;border-radius:50%;background:var(--sun);color:#3a2300;display:grid;place-items:center;font-weight:800;font-family:Fraunces,Georgia,serif;font-size:18px}
.fact p{margin:0;font-size:15px;line-height:1.5}
.fact p b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-bottom:2px}

.grow{background:linear-gradient(160deg,var(--sea2),var(--sea));color:#fff;border-radius:26px;padding:22px 18px 18px;position:relative;overflow:hidden}
.grow .eyebrow{color:var(--sun)}.grow h2{color:#fff}
.school{display:flex;align-items:flex-end;justify-content:space-between;gap:4px;margin:10px 0 4px}
.school .st{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0}
.school .st svg{color:#bff3f1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}
.school .st b{font-family:Fraunces,Georgia,serif;font-size:18px}
.school .st span{font-size:11.5px;opacity:.75;white-space:nowrap}
.school .arrow{opacity:.45;margin-bottom:42px;flex:none}
.big{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 4px;padding-top:14px;border-top:1px solid rgba(255,255,255,.15)}
.big div b{display:block;font-family:Fraunces,Georgia,serif;font-size:26px;color:var(--sun)}
.big div span{font-size:12.5px;opacity:.8}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.chart text{font-size:10px;fill:rgba(255,255,255,.65);font-family:Inter,sans-serif}
details.tbl{margin-top:10px}
details.tbl summary{cursor:pointer;font-weight:600;font-size:14px;color:#bff3f1;list-style:none;display:flex;align-items:center;gap:4px}
details.tbl summary::-webkit-details-marker{display:none}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
th{text-align:left;font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:.08em;font-weight:600;padding:6px 0}
td{padding:8px 0;border-top:1px solid rgba(255,255,255,.12)}.r{text-align:right}

.home{background:var(--card);border-radius:26px;padding:22px 18px;border:1px solid var(--line)}
.tankill{display:block;width:100%;height:auto;margin:4px 0 10px}
.tankill .sw{animation:swim 6s ease-in-out infinite}
.cond{display:grid;gap:10px}
.cd{display:grid;grid-template-columns:46px 1fr auto;gap:8px 12px;align-items:center;padding:12px;border-radius:18px;background:var(--foam)}
.cd .ci{width:46px;height:46px;border-radius:14px;background:var(--card);display:grid;place-items:center}
.cd h3{margin:0;font-size:15px}
.cd p{margin:2px 0 0;font-size:13.5px;color:var(--muted);line-height:1.4}
.cd .v{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:22px;text-align:right;white-space:nowrap}
.cd .v small{font-family:Inter,sans-serif;font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
.meter{grid-column:1/-1;height:8px;border-radius:99px;position:relative;margin:4px 2px 2px}
.meter.t{background:linear-gradient(90deg,#4f8fe0,#11a3ad 35%,#38c172 55%,#ffb347 78%,#ff7a59)}
.meter.o{background:linear-gradient(90deg,#ff7a59,#ffb347 33%,#38c172 55%,#11a3ad)}
.meter i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--sea);transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.meter span{position:absolute;top:12px;font-size:10.5px;color:var(--muted)}
.cd.hasm{padding-bottom:22px}
.feed{display:flex;gap:12px;align-items:center;margin-top:10px;padding:12px;border-radius:18px;border:1.5px dashed var(--line)}
.feed b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}

.polas{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 4px}
.pola{all:unset;cursor:zoom-in;background:#fff;padding:8px 8px 10px;border-radius:6px;box-shadow:0 10px 24px rgba(6,50,58,.16);transform:rotate(var(--r));transition:transform .25s;display:block}
.pola:hover{transform:rotate(0) scale(1.02)}
.pola:first-child{grid-column:1/-1}
.pola img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:3px;background:#dfe9ea}
.pola:first-child img{aspect-ratio:16/10}
.pola span{display:block;font-family:Fraunces,Georgia,serif;font-style:italic;color:#36464c;font-size:14px;margin-top:8px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pola em{display:block;font-style:normal;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#11a3ad;text-align:center;margin-top:2px;font-weight:700}
.filt{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;scrollbar-width:none}
.filt button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 13px;font:600 13px Inter,sans-serif;white-space:nowrap;cursor:pointer}
.filt button.on{background:var(--sea);border-color:var(--sea);color:#fff}

.idcard{background:var(--sand);border-radius:22px;padding:18px;position:relative;overflow:hidden}
.idcard .kv{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:14.5px}
.idcard .kv span{color:var(--muted)}
.idcard .stamp{position:absolute;right:-10px;top:-6px;color:var(--sea);opacity:.10}
.note{border-left:4px solid var(--sun);padding:4px 0 4px 14px;margin:0;font-family:Fraunces,Georgia,serif;font-style:italic;font-size:18px;line-height:1.5;white-space:pre-wrap}
footer{text-align:center;color:var(--muted);font-size:13px;padding:36px 16px calc(36px + env(safe-area-inset-bottom));line-height:1.7}
footer .fish{color:var(--teal);opacity:.6}
footer a{color:var(--teal);font-weight:600}

.lb{position:fixed;inset:0;z-index:50;background:rgba(2,10,14,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top)) 10px calc(18px + env(safe-area-inset-bottom))}
.lb img{max-width:100%;max-height:76vh;border-radius:10px;object-fit:contain}
.lb .x,.lb .nav{position:absolute;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:50%;width:42px;height:42px;font-size:22px;cursor:pointer;display:grid;place-items:center}
.lb .x{top:calc(10px + env(safe-area-inset-top));right:12px}
.lb .nav{top:50%;transform:translateY(-50%)}.lb .prev{left:8px}.lb .next{right:8px}
.lb .cap{color:#e6edf3;text-align:center;margin-top:12px;font-size:15px;max-width:520px;font-family:Fraunces,Georgia,serif;font-style:italic}
.lb .cap small{display:block;color:#8d9cab;font-size:12.5px;margin-top:3px;font-family:Inter,sans-serif;font-style:normal}
.lb .cnt{position:absolute;top:calc(20px + env(safe-area-inset-top));left:16px;color:#8d9cab;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.list{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.list a{display:block;text-align:center;padding:14px 0;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-family:Fraunces,Georgia,serif;font-weight:800;font-size:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
@media (min-width:700px){.nums{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="out"><div class="hero"><svg class="wave" viewBox="0 0 1200 60" preserveAspectRatio="none"><path d="M0 30 Q150 0 300 30 T600 30 T900 30 T1200 30 V60 H0Z" fill="currentColor"/></svg></div></div>
<script type="module">
import { FB } from "./firebase.js";
const out = document.getElementById("out");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (x, d = 1) => (+x || 0).toLocaleString("pt-PT", { maximumFractionDigits: d });
const fdate = (t) => t ? new Date(t).toLocaleDateString("pt-PT", { day: "numeric", month: "long", year: "numeric" }) : "—";
const fshort = (t) => new Date(t).toLocaleDateString("pt-PT", { day: "numeric", month: "short" }).replace(".", "");
const has = (v) => v !== null && v !== undefined && v !== "";
function age(b) { if (!b) return ""; const days = Math.floor((Date.now() - b) / 864e5); if (days < 0) return ""; if (days < 60) return days + (days === 1 ? " dia" : " dias"); const m = Math.floor(days / 30.44); if (m < 24) return m + " meses"; const y = Math.floor(m / 12), r = m % 12; return y + (y === 1 ? " ano" : " anos") + (r ? " e " + r + (r === 1 ? " mês" : " meses") : ""); }
const daysSince = (t) => Math.max(0, Math.floor((Date.now() - t) / 864e5));
const CATS = { especie: "Espécie", amostragem: "Amostragem", praticas: "No dia a dia" };
const TANKS = Array.from({ length: 12 }, (_, i) => "R" + (i + 1));
const id = new URLSearchParams(location.search).get("t");

/* ---------- Comparações do dia a dia, para quem não é da área ---------- */
const WEIGHTS = [[1, "um clipe"], [8.5, "uma moeda de 2 €"], [23, "uma pilha AA"], [60, "um ovo"], [150, "uma maçã"], [190, "um telemóvel"], [400, "uma lata de conserva grande"], [1000, "uma garrafa de água de 1 litro"], [1500, "um melão pequeno"], [3500, "um bebé recém-nascido"], [10000, "um balde de água cheio"]];
const LENGTHS = [[1.5, "uma unha"], [8.5, "um cartão multibanco"], [15, "uma caneta"], [19, "um lápis novo"], [30, "uma régua escolar"], [45, "um teclado de computador"], [120, "uma criança de 7 anos"]];
function compare(v, table, what) {
  if (!(v > 0)) return "";
  let best = table[0], bd = Infinity;
  for (const t of table) { const d = Math.abs(Math.log(v / t[0])); if (d < bd) { bd = d; best = t; } }
  const r = v / best[0];
  if (r > 0.8 && r < 1.25) return `mais ou menos ${what} <b>${best[1]}</b>`;
  if (r >= 1.25) return `${what} <b>${num(Math.round(r * 2) / 2, 1)} × ${best[1]}</b>`;
  return `um pouco menos do que <b>${best[1]}</b>`;
}

/* ---------- Curiosidades de espécies comuns em aquacultura ---------- */
const SPECIES = [
  { m: /solea|linguado/i, shape: "flat", facts: [["Peixe achatado", "Nasce com um olho de cada lado da cabeça, como os outros peixes. Ao crescer, um dos olhos “viaja” e ficam os dois do mesmo lado do corpo."], ["Mestre da camuflagem", "Passa o dia deitado no fundo, muitas vezes meio enterrado na areia, com uma cor parecida com a do fundo."]] },
  { m: /sparus|dourada/i, shape: "fish", facts: [["Porquê “dourada”?", "Tem uma faixa dourada entre os olhos, como uma sobrancelha, que lhe dá o nome."], ["Muda de sexo", "A maioria das douradas começa a vida como macho e, mais tarde, transforma-se em fêmea."]] },
  { m: /dicentrarchus|robalo/i, shape: "fish", facts: [["Viajante", "Aguenta água salgada e também água quase doce, por isso entra em rias e estuários."], ["Caçador", "É um predador ágil, que caça pequenos peixes e crustáceos."]] },
  { m: /epinephelus|mero/i, shape: "grouper", facts: [["Vida longa", "Pode viver mais de 50 anos e ultrapassar 1 metro de comprimento."], ["Muda de sexo", "Os meros nascem fêmeas e, com a idade, alguns transformam-se em machos."], ["Espécie a proteger", "No mar é uma espécie ameaçada. Estudá-la ajuda a conhecê-la e a protegê-la."]] },
  { m: /argyrosomus|corvina/i, shape: "fish", facts: [["Peixe que “fala”", "Faz sons graves, como um tambor, usando a bexiga natatória."], ["Gigante", "No mar pode ultrapassar os 2 metros."]] },
  { m: /diplodus|sargo/i, shape: "fish", facts: [["Riscas pretas", "Reconhece-se pelas riscas verticais escuras e por uma mancha preta junto à cauda."]] },
];
const spInfo = (f) => SPECIES.find(s => s.m.test((f.sci || "") + " " + (f.species || ""))) || { shape: "fish", facts: [] };

/* ---------- Ilustrações (SVG desenhado aqui) ---------- */
function fishSvg(shape) {
  if (shape === "flat") return `<svg viewBox="0 0 320 180" aria-hidden="true">
    <defs><radialGradient id="fg1" cx=".4" cy=".4"><stop offset="0" stop-color="#f3d7a8"/><stop offset="1" stop-color="#c49a62"/></radialGradient><pattern id="sp1" width="22" height="18" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.4" fill="#8b6339" opacity=".35"/><circle cx="16" cy="13" r="1.6" fill="#8b6339" opacity=".3"/></pattern></defs>
    <path d="M40 92 C40 40 120 22 190 30 C240 36 268 60 270 90 C268 120 240 144 190 150 C120 158 40 140 40 92Z" fill="none" stroke="#c49a62" stroke-width="16" stroke-dasharray="2 5" opacity=".75"/>
    <path d="M44 92 C44 46 120 30 190 36 C236 41 262 62 264 90 C262 118 236 139 190 144 C120 150 44 136 44 92Z" fill="url(#fg1)"/>
    <path d="M44 92 C44 46 120 30 190 36 C236 41 262 62 264 90 C262 118 236 139 190 144 C120 150 44 136 44 92Z" fill="url(#sp1)"/>
    <path d="M262 90 L304 62 C299 82 299 98 304 118Z" fill="#c49a62"/>
    <circle cx="74" cy="78" r="7.5" fill="#fff"/><circle cx="75" cy="78" r="4.2" fill="#10232a"/><circle cx="90" cy="66" r="6.5" fill="#fff"/><circle cx="91" cy="66" r="3.8" fill="#10232a"/>

function growthHtml(P) {

  const first = pts[0], last = pts[pts.length - 1], days = Math.max(1, (last.t - first.t) / 864e5), dg = last.weight - first.weight;
  const pick = pts.length <= 3 ? pts : [pts[0], pts[Math.floor((pts.length - 1) / 2)], pts[pts.length - 1]];
  const mx = Math.max(...pick.map(p => p.weight));
  const school = pick.map((p, i) => `${i ? `<span class="arrow">${I.arrow}</span>` : ""}<div class="st">${miniFish(Math.round(34 + 56 * Math.sqrt(p.weight / mx)))}<b>${num(p.weight)} g</b><span>${fshort(p.t)}</span></div>`).join("");

    let hi = Math.max(...pts.map(p => p.weight)), lo = Math.min(...pts.map(p => p.weight)); const pad = (hi - lo) * .15 || 1; lo = Math.max(0, lo - pad); hi += pad;
    const X = t => L + (W - L - R) * ((t - t0) / ((t1 - t0) || 1)), Y = v => H - B - (H - T - B) * ((v - lo) / ((hi - lo) || 1));

const fullCache = {};
function full(pid) { if (!fullCache[pid]) fullCache[pid] = FB.getDoc(FB.doc(FB.db, "fotosFull/" + pid)).then(s => s.exists() ? s.data().data : null).catch(() => null); return fullCache[pid]; }
function lightbox(i, list) {
  let k = Math.max(0, list.indexOf(PH[i]));
  const lb = document.createElement("div"); lb.className = "lb";
  lb.innerHTML = `<span class="cnt"></span><button class="x" aria-label="Fechar">×</button>${list.length > 1 ? '<button class="nav prev" aria-label="Anterior">‹</button><button class="nav next" aria-label="Seguinte">›</button>' : ""}<img alt=""><div class="cap"></div>`;
  document.body.appendChild(lb); document.body.style.overflow = "hidden";
  const img = lb.querySelector("img"), cap = lb.querySelector(".cap"), cnt = lb.querySelector(".cnt");
  function show() { const p = list[k]; img.src = p.thumb; cap.innerHTML = `${esc(p.caption || CATS[p.cat] || "")}<small>${CATS[p.cat] || ""} · ${fdate(p.t)}</small>`; cnt.textContent = list.length > 1 ? `${k + 1} / ${list.length}` : ""; const want = p.id; full(want).then(d => { if (d && list[k].id === want) img.src = d; }); }
  const go = (s) => { k = (k + s + list.length) % list.length; show(); };
  function close() { lb.remove(); document.body.style.overflow = ""; document.removeEventListener("keydown", key); }
  function key(e) { if (e.key === "Escape") close(); else if (e.key === "ArrowLeft") go(-1); else if (e.key === "ArrowRight") go(1); }
  lb.onclick = (e) => { if (e.target === lb || e.target.classList.contains("x")) close(); else if (e.target.classList.contains("prev")) go(-1); else if (e.target.classList.contains("next")) go(1); };

let io = null, seen = false;
function reveal(now) {
  const els = document.querySelectorAll(".reveal:not(.in)");

      <div class="kicker">Conheça</div>
      <h1>${esc(name)}</h1>
      ${f.sci ? `<div class="sci">${esc(f.sci)}</div>` : ""}
      ${tags.length ? `<div class="tags">${tags.map(t => `<span>${t}</span>`).join("")}</div>` : ""}
    </div></div>
    ${WAVE}<a class="cue" href="#c" aria-label="Descobrir mais">${I.down}</a>
  </header>
  <main class="wrap" id="c">
    ${nums.length ? `<div class="nums">${nums.join("")}</div>` : ""}
    ${f.about || facts ? `<section class="reveal"><div class="who"><p class="eyebrow">Quem é?</p><h2>${esc(name)}</h2>
      <div class="illu">${fishSvg(info.shape)}</div>
      ${f.about ? `<p class="lead">${esc(f.about)}</p>` : ""}
      ${facts ? `<div class="facts"><p class="eyebrow" style="margin:4px 0 0">Sabia que…</p>${facts}</div>` : ""}</div></section>` : ""}
    ${P.length ? growthHtml(P) : ""}
    ${homeHtml(f, info.shape)}
    ${galleryHtml()}
    ${kv.length ? `<section class="reveal"><div class="idcard"><div class="stamp">${miniFish(110)}</div><p class="eyebrow">Bilhete de identidade</p><div class="kv">${kv.map(([k, v]) => `<span>${k}</span><div>${v}</div>`).join("")}</div></div></section>` : ""}
    ${f.notes ? `<section class="reveal"><p class="eyebrow">Nota da equipa</p><p class="note">${esc(f.notes)}</p></section>` : ""}
  </main>
  <footer><div class="fish">${miniFish(40)}</div>Estes peixes são cuidados todos os dias pela nossa equipa.<br>Informação atualizada a ${fdate(f.updatedAt)}.<br><a href="./#${esc(id)}">Equipa: abrir na app</a></footer>`;
  bindGallery(); reveal(); seen = true;
  if (cov && !heroFull[cov.id]) full(cov.id).then(d => { if (!d) return; heroFull[cov.id] = d; const bg = document.getElementById("herobg"); if (bg) { bg.style.backgroundImage = `url('${d}')`; bg.classList.remove("lo"); } });
}

if (!id || !TANKS.includes(id)) picker(id ? "Não encontrámos esse tanque. Escolha um:" : "Escolha um tanque para conhecer os peixes que lá vivem:");
else {
  FB.onSnapshot(FB.doc(FB.db, "fichas/" + id), (s) => {
    if (!s.exists()) { F = null; out.innerHTML = `<div class="hero" style="height:62svh"><div class="nophoto">${fishSvg("fish")}</div><div class="tint"></div>${bubbles()}${TOP()}<div class="txt"><div class="wrap"><div class="kicker">Em breve</div><h1>Novos habitantes</h1></div></div>${WAVE}</div><div class="wrap"><p class="lead" style="text-align:center;padding-top:20px">Ainda não há informação sobre este tanque. Volte em breve!</p></div>`; return; }
    F = s.data(); render();
  }, (e) => { out.innerHTML = `<div class="wrap" style="padding-top:40px"><p class="empty">Não foi possível carregar a ficha.<br><small>${esc(e && e.code || e)}</small></p></div>`; });
  FB.onSnapshot(FB.query(FB.collection(FB.db, "fotos"), FB.where("tank", "==", id)), (s) => {
    PH = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.t || 0) - (a.t || 0));
    if (F) render();
  }, () => {});
}
</script>
</body>
</html>
