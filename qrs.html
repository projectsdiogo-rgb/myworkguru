<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR codes dos tanques · MyWorkGuru</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#eef1f4;color:#14202b}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 18px;background:#fff;border-bottom:1px solid #dde2e8;position:sticky;top:0}
.bar b{font-family:"Space Grotesk",sans-serif;font-size:18px}.bar p{margin:2px 0 0;color:#5d6b78;font-size:13px}
button{font:inherit;font-weight:700;border:0;background:#0e7c86;color:#fff;padding:11px 18px;border-radius:10px;cursor:pointer}
.sheet{width:210mm;min-height:297mm;margin:16px auto;background:#fff;padding:10mm;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:66mm;gap:6mm;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.lab{border:1.5px dashed #b8c2cc;border-radius:5mm;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3mm;break-inside:avoid}
.lab svg{width:42mm;height:42mm;display:block}
.lab .t{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:26pt;line-height:1;margin-top:1mm}
.lab .s{font-size:8pt;color:#5d6b78;margin-top:1mm}
@media screen and (max-width:820px){.sheet{width:auto;min-height:0;margin:12px;grid-template-columns:repeat(2,1fr);grid-auto-rows:auto;padding:12px}.lab svg{width:100%;height:auto;max-width:160px}}
@media print{@page{size:A4;margin:0}body{background:#fff}.bar{display:none}.sheet{margin:0;box-shadow:none}}
</style>
</head>
<body>
<div class="bar"><div><b>QR codes dos tanques interiores</b><p>Cada código abre a ficha pública do peixe desse tanque. Recorte pelas linhas tracejadas.</p></div><button onclick="window.print()">Imprimir</button></div>
<div class="sheet" id="sheet"></div>
<script type="module">
import { qrSvg } from "./qr.js";
const base = new URL("ficha.html", location.href.split("#")[0].split("?")[0]).href;
document.getElementById("sheet").innerHTML = Array.from({ length: 12 }, (_, i) => "R" + (i + 1)).map(t =>
  `<div class="lab">${qrSvg(base + "?t=" + t, { border: 2 })}<div class="t">${t}</div><div class="s">Ficha do peixe · MyWorkGuru</div></div>`).join("");
</script>
</body>
</html>
